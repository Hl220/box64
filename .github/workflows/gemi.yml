name: Rebuild Expired Artifact

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target Repo (e.g. ptitSeb/box64 or NVIDIAGameWorks/bridge-remix)'
        required: true
        type: string
      ref:
        description: 'Commit SHA (short/long) or Tag (e.g. c40116b or v1.0.0)'
        required: true
        type: string
      branch_name:
        description: 'Branch to trigger build on'
        required: false
        default: 'main'
        type: string
      cleanup_commit_log:
        description: 'Reset branch back to original state after trigger? (true/false)'
        required: false
        default: true
        type: boolean

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Local Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Save Original Branch State & Workflows
        run: |
          # Save the current commit hash so we can revert back to it later
          ORIGINAL_SHA=$(git rev-parse HEAD)
          echo "ORIGINAL_SHA=$ORIGINAL_SHA" >> $GITHUB_ENV

          # Backup local workflows
          mkdir -p /tmp/workflow_backup
          cp -r .github/workflows/* /tmp/workflow_backup/ 2>/dev/null || true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch Target Code (Supports Short SHA, Tag, Full SHA)
        run: |
          git remote add target "https://github.com/${{ inputs.target_repo }}.git"
          git fetch target --tags

          git checkout -B "${{ inputs.branch_name }}"

          # Resolve short SHA, tag, or full SHA
          TARGET_COMMIT=$(git rev-parse --verify "${{ inputs.ref }}" 2>/dev/null || \
                          git rev-parse --verify "target/${{ inputs.ref }}" 2>/dev/null || \
                          git rev-parse --verify "refs/tags/${{ inputs.ref }}" 2>/dev/null || \
                          git rev-parse --verify "refs/tags/${{ inputs.ref }}^{commit}" 2>/dev/null)

          if [ -z "$TARGET_COMMIT" ]; then
            echo "Error: Could not resolve commit or tag '${{ inputs.ref }}'"
            exit 1
          fi

          echo "Resolved Commit: $TARGET_COMMIT"
          git reset --hard "$TARGET_COMMIT"

      - name: Patch Branch Triggers
        run: |
          if [ -d ".github/workflows" ]; then
            sed -i 's/branches: .*/branches: ["*"]/g' .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null || true
          fi

      - name: Restore Rebuilder Workflow
        run: |
          mkdir -p .github/workflows
          cp -r /tmp/workflow_backup/* .github/workflows/ 2>/dev/null || true
          git add .github/workflows/
          git commit -m "Temp build commit" || true

      - name: Push Build Commit
        run: |
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git "${{ inputs.branch_name }}" --force

      - name: Clean Up Commit History
        if: ${{ inputs.cleanup_commit_log }}
        run: |
          echo "Waiting 30 seconds for GitHub Actions to pick up the run..."
          sleep 30

          echo "Resetting branch '${{ inputs.branch_name }}' back to original SHA: $ORIGINAL_SHA"
          git reset --hard "$ORIGINAL_SHA"
          
          # Force push to remove the temporary build commit from history
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git "${{ inputs.branch_name }}" --force
