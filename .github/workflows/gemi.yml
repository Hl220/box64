name: Rebuild Expired Artifact

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target Repo (e.g. ptitseb/box64 or NVIDIAGameWorks/bridge-remix)'
        required: true
        type: string
      ref:
        description: 'Commit SHA (short/long) or Tag (e.g. 7eeb501 or v0.3.2)'
        required: true
        type: string
      branch_name:
        description: 'Target branch to push commit to'
        required: false
        default: 'main'
        type: string

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Backup Rebuilder Workflow to 'rebuilder' Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Saves this workflow to a dedicated 'rebuilder' branch so it is never lost
          git checkout -B rebuilder
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git rebuilder --force

      - name: Fetch Target Commit / Tag
        run: |
          git remote add target "https://github.com/${{ inputs.target_repo }}.git"
          git fetch target --tags

          # Resolve short SHA, tag, or full SHA to exact commit hash
          TARGET_COMMIT=$(git rev-parse --verify "${{ inputs.ref }}" 2>/dev/null || \
                          git rev-parse --verify "target/${{ inputs.ref }}" 2>/dev/null || \
                          git rev-parse --verify "refs/tags/${{ inputs.ref }}" 2>/dev/null || \
                          git rev-parse --verify "refs/tags/${{ inputs.ref }}^{commit}" 2>/dev/null)

          if [ -z "$TARGET_COMMIT" ]; then
            echo "Error: Could not resolve commit or tag '${{ inputs.ref }}'"
            exit 1
          fi

          echo "Resolved Commit: $TARGET_COMMIT"
          echo "TARGET_COMMIT=$TARGET_COMMIT" >> $GITHUB_ENV

      - name: Push Exact Target Commit
        run: |
          # Pushes $TARGET_COMMIT directly as the HEAD of the target branch.
          # No extra commits, patches, or modifications are appended.
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git "$TARGET_COMMIT:refs/heads/${{ inputs.branch_name }}" --force
